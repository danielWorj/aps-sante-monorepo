version: "3.9"

services:
  client-plateform:
    build:
      context: ./client-plateform
      args:
        VITE_API_URL: ${VITE_API_URL_PLATEFORM}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        # Clé publique Stripe : la même que celle renvoyée par le serveur à l'app mobile.
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
        # Marque : mêmes variables que le serveur (NOM_MARQUE, RAISON_SOCIALE du .env).
        VITE_NOM_MARQUE: ${NOM_MARQUE:-}
        VITE_RAISON_SOCIALE: ${RAISON_SOCIALE:-}
    # Publié sur la boucle locale uniquement : seul nginx (sur l'hôte) y
    # accède. Sans « 127.0.0.1: », Docker ouvre le port sur toutes les
    # interfaces, en contournant le pare-feu (ufw) de l'hôte.
    ports:
      - "127.0.0.1:8085:80"
    depends_on:
      server:
        condition: service_started   
    restart: unless-stopped

  client-backoffice:
    build:
      context: ./client-backoffice/back-office-app
      args:
        VITE_API_URL: ${VITE_API_URL_BACKOFFICE}
        VITE_NOM_MARQUE: ${NOM_MARQUE:-}
        VITE_RAISON_SOCIALE: ${RAISON_SOCIALE:-}
    # Boucle locale uniquement (voir client-plateform).
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - server
    restart: unless-stopped

  server:
    build: ./server
    env_file: .env
    # Jamais exposé sur Internet : l'API n'est joignable que via nginx
    # (api.azasante.com). Exposée directement, n'importe qui pourrait
    # forger X-Forwarded-For (trust proxy = 1) et contourner tous les
    # limiteurs de débit (connexion, SMS facturés, Google Maps).
    #  - 127.0.0.1 : nginx de l'hôte ;
    #  - passerelle docker0 : Prosody (jitsi-host) appelle le webhook de fin
    #    de visio via host.docker.internal:3000 (= cette passerelle,
    #    172.17.0.1 par défaut, injoignable depuis Internet). Si docker0 a
    #    une autre adresse sur le VPS (`ip -4 addr show docker0`), la
    #    renseigner dans DOCKER_HOST_GATEWAY_IP (.env).
    ports:
      - "127.0.0.1:3000:3000"
      - "${DOCKER_HOST_GATEWAY_IP:-172.17.0.1}:3000:3000"
    volumes:
      - ./server/keys:/app/keys:ro
      # Stockage des APK : bind mount vers un vrai dossier du VPS
      # (./server/storage/apk), PAS un volume anonyme. Sans ça, chaque
      # rebuild/redeploy recrée le conteneur "server" à partir du
      # Dockerfile (COPY . .) : storage/apk est vide au démarrage
      # (il est dans .gitignore, donc jamais copié), et tout APK
      # uploadé avant le déploiement précédent disparaît — alors que
      # l'entrée correspondante reste en base (Prisma), d'où un 404
      # au téléchargement pour un APK que l'admin voit pourtant listé.
      # Le dossier hôte est créé automatiquement par Docker au premier
      # démarrage s'il n'existe pas encore.
      - ./server/storage/apk:/app/storage/apk
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgis/postgis:16-3.4-alpine
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Pas de "ports:" exposés publiquement, voir bonnes pratiques

volumes:
  pg_data: