version: "3.9"

services:
  client-plateform:
    build:
      context: ./client-plateform
      args:
        VITE_API_URL: ${VITE_API_URL_PLATEFORM}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
    ports:
      - "8085:80"
    depends_on:
      server:
        condition: service_started   
    restart: unless-stopped

  client-backoffice:
    build:
      context: ./client-backoffice/back-office-app
      args:
        VITE_API_URL: ${VITE_API_URL_BACKOFFICE}
    ports:
      - "8081:80"
    depends_on:
      - server
    restart: unless-stopped

  server:
    build: ./server
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./server/keys:/app/keys:ro
      # Stockage des APK : bind mount vers un vrai dossier du VPS
      # (./server/storage/apk), PAS un volume anonyme. Sans ça, chaque
      # rebuild/redeploy recrée le conteneur "server" à partir du
      # Dockerfile (COPY . .) : storage/apk est vide au démarrage
      # (il est dans .gitignore, donc jamais copié), et tout APK
      # uploadé avant le déploiement précédent disparaît — alors que
      # l'entrée correspondante reste en base (Prisma), d'où un 404
      # au téléchargement pour un APK que l'admin voit pourtant listé.
      # Le dossier hôte est créé automatiquement par Docker au premier
      # démarrage s'il n'existe pas encore.
      - ./server/storage/apk:/app/storage/apk
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgis/postgis:16-3.4-alpine
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Pas de "ports:" exposés publiquement, voir bonnes pratiques

volumes:
  pg_data: