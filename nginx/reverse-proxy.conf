server {
    listen 80;
    server_name azasante.com;
    location / { proxy_pass http://127.0.0.1:8085; proxy_set_header Host $host; }
}

server {
    listen 80;
    server_name admin.azasante.com;
    location / { proxy_pass http://127.0.0.1:8081; proxy_set_header Host $host; }
}

server {
    listen 80;
    server_name api.azasante.com;
    client_max_body_size 20M;
    location / { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; }
}

server {
    listen 80;
    server_name meet.azasante.com;

    # Jitsi passe des payloads plus lourds (upload de fichiers, avatars, etc.)
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # BOSH et WebSocket XMPP : nécessitent l'upgrade de connexion,
    # sinon le chat/la visio ne se connectent jamais côté signalisation.
    location /http-bind {
        proxy_pass http://127.0.0.1:8000/http-bind;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /xmpp-websocket {
        proxy_pass http://127.0.0.1:8000/xmpp-websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Colibri WebSocket (JVB) : indispensable pour l'audio/vidéo en
    # temps réel, pas juste le chargement de la page.
    location ~ ^/colibri-ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}