server {
    listen 80;
    server_name azasante.com;
    location / { proxy_pass http://127.0.0.1:8085; proxy_set_header Host $host; }
}

server {
    listen 80;
    server_name admin.azasante.com;
    location / { proxy_pass http://127.0.0.1:8081; proxy_set_header Host $host; }
}

server {
    listen 80;
    server_name api.azasante.com;
    client_max_body_size 120M;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ── Observabilité (docker-compose.observabilite.yaml) ──
# logs.azasante.com      → Grafana     (127.0.0.1:3002) : logs Loki + tableaux de bord
# metriques.azasante.com → Prometheus  (127.0.0.1:9090) : protégé par mot de passe nginx
# Loki et Alloy ne sont JAMAIS exposés.
# Dans .env : GRAFANA_ROOT_URL=https://logs.azasante.com et GRAFANA_COOKIE_SECURE=true.
# Mot de passe Prometheus : htpasswd -c /etc/nginx/.htpasswd-metriques <utilisateur>
server {
    listen 80;
    server_name logs.azasante.com;
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafana Live (WebSocket).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name metriques.azasante.com;
    # Prometheus n'a pas d'authentification propre : nginx la porte.
    auth_basic "Metriques APS Sante";
    auth_basic_user_file /etc/nginx/.htpasswd-metriques;
    # --web.enable-lifecycle : arrêt/rechargement réservés au VPS.
    location ~ ^/-/(quit|reload) { return 403; }
    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ⭐ NOUVEAU BLOC POUR JITSI
server {
    listen 80;
    listen 443 ssl http2;
    server_name meet.azasante.com;

    ssl_certificate /etc/letsencrypt/live/azasante.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azasante.com/privkey.pem;

    # Redirection HTTP → HTTPS
    if ($scheme = http) {
        return 301 https://$server_name$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;

        # Headers essentiels
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # WebSocket support (critique pour Jitsi)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts longs pour appels vidéo
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}