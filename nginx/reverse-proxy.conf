
server {
    listen 80;
    server_name azasante.com;
    location / { proxy_pass http://127.0.0.1:8085; proxy_set_header Host $host; }
}

server {
    listen 80;
    server_name admin.azasante.com;
    location / { proxy_pass http://127.0.0.1:8081; proxy_set_header Host $host; }
}

server {
    listen 80;
    server_name api.azasante.com;
    client_max_body_size 20M;
    location / { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; }
}

# ⭐ NOUVEAU BLOC POUR JITSI
server {
    listen 80;
    listen 443 ssl http2;
    server_name meet.azasante.com;

    ssl_certificate /etc/letsencrypt/live/azasante.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azasante.com/privkey.pem;

    # Redirection HTTP → HTTPS
    if ($scheme = http) {
        return 301 https://$server_name$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        
        # Headers essentiels
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # WebSocket support (critique pour Jitsi)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts longs pour appels vidéo
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
