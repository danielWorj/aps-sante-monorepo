# Prometheus — cibles internes au réseau Docker du projet.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alertes.yml

scrape_configs:
  # API Node.js (prom-client, port interne METRICS_PORT).
  - job_name: api
    static_configs:
      - targets: ["server:9464"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # On ne garde que les conteneurs docker compose (pas les cgroups système).
      - source_labels: [container_label_com_docker_compose_service]
        regex: ""
        action: drop

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
